
name: Flutter Web CI/CD (DEV)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

# Use the same concurrency group as MAIN
concurrency:
  group: pages-port-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web (DEV)
        run: |
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/dev/"

      - name: Deploy Dev to Port Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: port
          publish_dir: build/web
          destination_dir: dev
          keep_files: true
