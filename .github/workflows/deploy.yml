
name: Deploy Main and Dev Flutter Portfolios

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Main and Dev Websites
    runs-on: ubuntu-24.04

    steps:
      # Checkout both branches
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main-source

      - name: Checkout Dev
        uses: actions/checkout@v5
        with:
          ref: dev
          path: dev-source

      # Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Build Main Portfolio
      - name: Build Main
        run: |
          cd main-source
          flutter pub get
          flutter build web --release \
            --base-href "/portfolio/"

      # Build Dev Portfolio
      - name: Build Dev
        run: |
          cd dev-source
          flutter pub get
          flutter build web --release \
            --base-href "/portfolio/dev/"

      # Combine both websites
      - name: Combine Websites
        run: |
          mkdir -p site
          mkdir -p site/dev

          cp -r main-source/build/web/. site/
          cp -r dev-source/build/web/. site/dev/

          cp site/index.html site/404.html
          cp site/dev/index.html site/dev/404.html

      # Upload combined website
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy Both Websites
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
